<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#75cef9">
  <title>윤수 별빛 사진첩</title>
  <link rel="stylesheet" href="album.css">
  <script defer src="album.js"></script>
</head>
<body>
  <main class="album">
    <div class="leaf">
      <header aria-label="윤수 별빛 사진첩">
        <div class="brand-copy"><h1>윤수 별빛<br>사진첩</h1><span class="subline">윤수의 이야기 극장</span></div>
      </header>
      <div class="board"><div class="sheets" id="sheets" aria-label="사진첩 페이지"></div></div>
    </div>
    <nav class="pager" aria-label="사진첩 페이지 이동">
      <button id="previous" type="button" aria-label="이전 페이지" hidden>‹</button>
      <p id="counter" aria-live="polite"></p>
      <button id="next-page" type="button" aria-label="다음 페이지" hidden>›</button>
      <p class="swipe" id="swipe" hidden>옆으로 밀어서 넘겨요</p>
    </nav>
    <p id="update-note" role="status" hidden></p>
  </main>
</body>
</html>
